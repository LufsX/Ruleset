name: Build
on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "Tools/requirements.txt"
      - name: Install dependencies
        run: pip install -r Tools/requirements.txt
      - name: Test
        run: python -m unittest discover -s Tools/tests -v
      - name: Install mihomo
        run: |
          set -euo pipefail
          MIHOMO_VERSION=$(curl --fail --silent --show-error \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -er '.tag_name | ltrimstr("v")')
          curl --fail --silent --show-error --location -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-arm64-v${MIHOMO_VERSION}.gz"
          gzip --test mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Build
        run: |
          python Tools/build.py
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_TOKEN }}
          external_repository: LufsX/ruleset.isteed.cc
          publish_branch: main
          publish_dir: ./Public
          full_commit_message: GitHub Actions Auto Update
          disable_nojekyll: true
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
